# Base configuration. paper.yaml / live.yaml override selected keys.

paths:
  duckdb: "data/market.duckdb"
  parquet_minute: "data/parquet/minute"
  kill_file: "data/KILL"
  reports: "reports"

universe:
  exchanges: ["NASDAQ", "NYSE", "AMEX"]       # KIS-tradeable only. No OTC/ARCA/BATS/IEX.
  core_price_min: 1.00
  core_price_max: 7.00
  watch_price_min: 0.50
  watch_price_max: 10.00
  min_addv_floor: 300000                       # USD; actual floor is max(this, derived)
  min_addv_60: 200000
  min_median_volume_20: 150000
  max_cs_spread: 0.03
  min_listed_sessions: 250
  no_split_within_sessions: 30
  exclude_financial_status: ["Q"]              # bankrupt. D/E are flagged, not dropped.
  exclude_sic: [6770]                          # blank-check SPACs
  exclude_annual_forms: ["20-F", "40-F"]       # foreign private issuers / ADRs

features:
  version: 1
  percentile_window: 252
  base_window: 20
  regime_window: 60

labeling:
  # 실험 I (docs/research_log.md). 20세션 +60%/-20% 는 기저확률이 4.85% 로 너무
  # 희귀해서 lift 추정이 노이즈였고, 거기서 유도된 가중치도 그만큼 나빴다.
  # 지평선과 배리어를 채택된 청산(C_WIDE: 스톱/트레일만, 실측 평균 보유 ~58세션,
  # 스톱 폭 가격의 20~50%)에 맞추면 기저확률이 15.79% 로 올라간다.
  #
  # 선택 없는 3창 검정에서 사전 확정 5개 중 3개가 현행을 모든 창에서 이겼고,
  # 성과는 기저확률과 거의 단조 관계였다:
  #   20세션 +60/-20  기저 4.85%  평균 CAGR  +0.21%  (현행)
  #   60세션 +100/-20 기저 6.27%  평균 CAGR  -1.73%  1/3
  #   60세션 +60/-20  기저 13.55% 평균 CAGR  +5.43%  3/3
  #   60세션 +60/-35  기저 15.79% 평균 CAGR +10.33%  3/3  <- 채택
  #   20세션 +30/-20  기저 16.24% 평균 CAGR +11.96%  3/3
  #
  # 20세션 +30/-20 이 점수는 가장 높지만 20세션 지평선이 실측 보유기간과
  # 모순된다. 점수가 아니라 메커니즘으로 60세션 +60/-35 를 택한다.
  horizon_days: 60
  upper_barrier: 0.60
  lower_barrier: -0.35
  atr_variant: {k_up: 10.0, k_dn: 3.5}
  exclude_gap_up_above: 0.60                   # T+1 open above upper barrier -> unachievable
  exclude_gap_down_below: -0.15

risk:
  # Sizing auto-switches to single-position mode below small_account_usd.
  # 0.0022. 리스크는 발견이 아니라 선택이다 -- DD 와 수익이 거의 비례해 함께
  # 움직이므로, 킬스위치 한도(-20%)가 달성 가능한 수익을 결정한다. 실측
  # (레짐 sma50, 비용 1.5x, 전구간):
  #   risk 0.40%  CAGR +7.56%  최대DD -31.40%  킬스위치 2022-05 발동
  #   risk 0.30%  CAGR +4.89%  최대DD -24.73%  킬스위치 2024-11 발동
  #   risk 0.22%  CAGR +3.41%  최대DD -17.76%  발동 안 함   <- 채택
  risk_per_trade: 0.0022
  small_account_usd: 1450                      # ~KRW 2,000,000 @ 1380
  stop_atr_mult: 2.5
  stop_min_pct: 0.20
  max_notional_pct_equity: 0.08                # hard, enforced in sizing.py
  max_participation: 0.01                      # hard
  max_notional_pct_addv: 0.02                  # hard
  # These three must stay consistent: max_concurrent * risk_per_trade <= heat.
  # Previously 10 x 1% = 10% against a 5% cap, which the sizer resolved by
  # shrinking later positions to dust instead of refusing them.
  #
  # 25 slots x 0.4% (experiment G, docs/research_log.md). Experiment C measured
  # that widening the book was monotonically WORSE and that is still true with
  # the shipped ladder and both early exits on -- extra slots only admitted
  # weaker signals. With thesis-break off the binding constraint moves to slot
  # count, and the sign flips: 5 -> 10 -> 15 -> 25 slots improved monotonically
  # on train AND holdout, in two independent symbol universes.
  max_concurrent_positions: 25
  max_portfolio_heat: 0.055        # = max_concurrent x risk_per_trade
  max_new_entries_per_day: 8
  daily_loss_soft: -0.03
  daily_loss_hard: -0.06
  drawdown_halt: -0.20
  consecutive_losses_halve: 8
  max_orders_per_session: 30
  max_orders_per_symbol: 5
  min_universe_ingest_rate: 0.85               # below this -> data-quality breaker

exits:
  # NO TAKE-PROFIT LADDER. The 9.99 gains disable the tranches rather than
  # deleting the code path, so a future experiment can turn them back on.
  #
  # The signal is trained on a +60% / 20-session triple barrier. Selling a
  # third at +30% caps exactly the move being predicted, and the trades that
  # pay for everything else are the ones it caps. Experiment C first measured
  # this; experiment G confirmed it with no selection involved -- a ladderless
  # book beat the shipped one in all three non-overlapping windows
  # (2020-2021, 2022-2023, 2024-2026) while the shuffled control was negative
  # in all three.
  tp1_gain: 9.99
  tp1_fraction: 0.0
  tp2_gain: 9.99
  tp2_fraction: 0.0
  trail_pct_of_high: 0.25
  trail_pct_tight: 0.18
  trail_tighten_above_gain: 2.00
  trail_atr_mult: 3.0
  # With no ladder the trail must be activated by gain, not by a TP tranche --
  # otherwise disabling the ladder silently disables the trail too, which is
  # the bug commit 01898e1 found.
  trail_activate_gain: 0.40
  # Thesis-break OFF. It fired on 141 of 277 trades at an average -12.5% and
  # looked like the dominant loss source, but it was not reducing losses: it
  # was removing the small-win population, which manufactured a high payoff
  # ratio out of a worse book. Turning it off beats keeping it at every slot
  # count tested, and in every window.
  thesis_enabled: false
  exhaustion_min_gain: 1.50
  exhaustion_volume_mult: 3.0
  # 타임스톱 OFF. 10000 은 비활성화이고 코드 경로는 남긴다.
  #
  # 좀비 포지션 버그(18efc6e)를 고친 엔진에서 측정하니 타임스톱이 최대 손실원이
  # 됐다 -- 청산 2,751건 중 1,961건이 타임스톱이고 평균 -13.2%, 합계 -$17,832.
  # 시그널은 +60%/20세션 삼중배리어로 학습했는데 15세션에서 수익률 +12% 미달이면
  # 자르므로, 예측 지평선이 끝나기도 전에 끊는다.
  #
  # 선택 없는 3창 검정(scripts/experiment_walkforward.py, 수정된 엔진):
  #   타임스톱 유지  +6.61% / -19.06% / -17.04%  (평균 -9.83%)
  #   타임스톱 OFF  +10.03% /  -3.97% /  +5.09%  (평균 +3.72%)
  # 최대DD 도 -29.1/-40.1/-52.3 에서 -15.5/-22.8/-18.2 로 개선된다.
  #
  # 버그 엔진에서는 반대 결론(타임스톱 유지)을 내렸다. 패자가 원가에 동결되는
  # 조건에서는 타임스톱이 자본을 회수해주는 것처럼 보였기 때문이다.
  time_stop_sessions: 10000
  time_stop_min_gain: 0.12

costs:
  commission_per_side: 0.0025                  # KIS US online
  sec_fee_rate: 0.0000278                      # sells only
  finra_taf_per_share: 0.000166
  finra_taf_cap: 8.30
  impact_k: 0.4                                # square-root law coefficient
  cs_spread_multiplier: 1.5                    # calibrate in Phase 1
  tick_size: 0.01
  stop_limit_penalty: 0.02                     # KIS has no stop-market; stops fill worse
  cost_multiplier: 1.0                         # stress-test knob: 1.0 / 1.5 / 2.0

entry:
  # 폭(게이트 통과 종목 중 SMA200 위 비율) 기반 레짐 게이트. 진입 억제만 하고
  # 보유 포지션은 건드리지 않는다 -- 레짐은 진입 판단이지 청산 규칙이 아니다.
  # sma50 = 폭이 자기 50일 평균 위일 때만 진입. 임계값을 특정 연도에 맞춰 고르는
  # 형태의 과적합을 피하려고 수준이 아니라 추세를 쓴다.
  #
  # 2022 를 -18.0% -> -1.4% 로 고쳤다(실험 J). 대가는 2023/2024 가 약간 악화된
  # 것이고, 폭이 낮은 국면의 좋은 날도 함께 걸러지기 때문이다.
  # 창 5개 서수 검정에서는 CAGR 기준 2/5 로 구조적 결과가 아니었으나, 구속
  # 조건이 CAGR 이 아니라 최대DD 였으므로 그 근거로 채택했다. src/uat/model/regime.py
  regime_mode: "sma50"
  max_watchlist: 40                            # KIS websocket hard limit is 41
  skip_gap_up_above: 0.20
  skip_gap_down_below: -0.08
  min_first5min_volume_ratio: 0.10
  max_quoted_spread: 0.025
  trigger_window_start: "09:35"
  trigger_window_end: "14:00"
  volume_confirm_mult: 1.5
  limit_over_ask: 0.004
  limit_over_trigger: 0.01
  child_order_count: 3
  child_order_interval_sec: 60
  cancel_unfilled_at: "15:45"
  max_signal_carry_sessions: 2
  # backtest daily-bar entry proxy
  bt_skip_open_above: 1.20
  bt_skip_open_below: 0.92
  bt_limit_over_open: 1.01
  bt_limit_cap_over_close: 1.08
  bt_carry_sessions: 2

broker:
  rate_limit_per_sec: 0.8                      # KIS overseas hard limit is 1/sec
  token_refresh_margin_hours: 2
