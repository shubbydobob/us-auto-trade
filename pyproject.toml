[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-auto-trade"
version = "0.1.0"
description = "US penny-stock pre-breakout detection and automated trading via KIS API"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "duckdb>=1.0",
    "yfinance>=0.2.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "exchange-calendars>=4.5",
]

[project.optional-dependencies]
dash = ["streamlit>=1.35", "plotly>=5.22", "fastapi>=0.110", "uvicorn>=0.30"]
ml = ["scikit-learn>=1.5"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
